<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>House</title>
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <div class="intro" id="intro">
        <div class="fade-text">The door locked behind you.</div>
    </div>

    <div class="game-container" id="game" style="display:none;">
        <!-- Фон прихожей (генерируется через CSS) -->
        <div class="room-bg"></div>
        
        <!-- Три интерактивные зоны -->
        <div class="hotspot left-zone" onclick="goSafe('living')"></div>
        <div class="hotspot center-zone" onclick="triggerTrap()"></div>
        <div class="hotspot right-zone" onclick="goSafe('stairs')"></div>

        <!-- Вспышка для скримера -->
        <div class="flash" id="flash"></div>
    </div>

    <script>
        // Запоминаем покупку
        localStorage.setItem('bought_house', 'true');

        // Интро: 3 секунды темноты, потом включается свет
        setTimeout(() => {
            document.getElementById('intro').style.display = 'none';
            document.getElementById('game').style.display = 'block';
        }, 3000);

        function goSafe(place) {
            // Безопасный переход (пока заглушка, потом сделаем новые комнаты)
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 1s';
            setTimeout(() => {
                alert("You moved to the " + place + ". (Next scene coming soon)");
                document.body.style.opacity = '1';
            }, 1000);
        }

        function triggerTrap() {
            // Игрок пошел в центр и попался
            const flash = document.getElementById('flash');
            const game = document.getElementById('game');
            
            // Тряска экрана
            game.style.animation = 'shake 0.5s infinite';
            
            // Вспышка
            flash.style.opacity = '1';
            
            // Через полсекунды — переход на экран смерти
            setTimeout(() => {
                window.location.href = 'death.html';
            }, 1000);
        }
    </script>
</body>
</html>
