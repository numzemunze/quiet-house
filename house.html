<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>House</title>
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <div class="game-container" id="game">
        <!-- Фон комнаты -->
        <div class="room-bg"></div>
        <div class="flicker-light"></div>

        <!-- Стартовый экран -->
        <div class="intro" id="intro" onclick="startGame()">
            <p>The door locked behind you.</p>
            <p class="tap-hint">[ Tap to open your eyes ]</p>
        </div>

        <!-- Интерактивные зоны (появятся после клика) -->
        <div id="hotspots" style="display:none;">
            <div class="hotspot left-zone" onclick="goSafe('living')"></div>
            <div class="hotspot center-zone" onclick="triggerTrap()"></div>
            <div class="hotspot right-zone" onclick="goSafe('stairs')"></div>
        </div>

        <!-- Красная вспышка -->
        <div class="flash" id="flash"></div>
    </div>

    <script>
        localStorage.setItem('bought_house', 'true');

        function startGame() {
            // Прячем интро
            document.getElementById('intro').style.display = 'none';
            // Показываем зоны для кликов
            document.getElementById('hotspots').style.display = 'block';
        }

        function goSafe(place) {
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 1s';
            setTimeout(() => {
                alert("You moved to the " + place + ". (Scene coming soon)");
                document.body.style.opacity = '1';
            }, 1000);
        }

        function triggerTrap() {
            const flash = document.getElementById('flash');
            const game = document.getElementById('game');
            
            // Тряска
            game.style.animation = 'shake 0.5s infinite';
            // Вспышка
            flash.style.opacity = '1';
            
            setTimeout(() => {
                window.location.href = 'death.html';
            }, 1000);
        }
    </script>
</body>
</html>
