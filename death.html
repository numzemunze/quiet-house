<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Error</title>
    <link rel="stylesheet" href="game.css">
    <style>
        body { background: #8b1e1e; color: #000; }
        .death-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .eye {
            font-size: 4em;
            animation: blink 2s infinite;
        }
        .return-btn {
            margin-top: 40px;
            color: #000;
            text-decoration: none;
            border: 2px solid #000;
            padding: 10px 20px;
            font-weight: bold;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <div class="death-screen">
        <div class="eye">👁️</div>
        <a href="index.html" class="return-btn">TRY AGAIN</a>
    </div>
    
    <script>
        // Записываем смерть в память
        let deaths = parseInt(localStorage.getItem('deaths') || '0');
        localStorage.setItem('deaths', deaths + 1);
    </script>
</body>
</html>
